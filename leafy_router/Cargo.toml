[package]
name = "leafy_router"
version.workspace = true
edition = "2021"
authors = ["yew-router authors", "Claude Code", "Finn Bear"]
repository.workspace = true
rust-version.workspace = true
description = "A port of yew-router 0.20 to leafy."
license.workspace = true

[dependencies]
gloo = { version = "0.12", default-features = false, features = ["history", "utils", "futures"] }
js-sys = "0.3"
serde = "1"
serde_urlencoded = "0.7.1"
urlencoding = "2.1.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "HtmlBaseElement", "Window", "Url", "Location"] }
leafy = { path = "../leafy", version = "0.1.0" }
leafy_router_macro = { path = "../leafy_router_macro", version = "0.1.0" }

[dev-dependencies]
# The matcher yew-router uses, to check `recognize` against.
route-recognizer = "0.3"
