name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      matrix:
        # Stable, and the minimum supported version.
        rust: [stable, "1.88"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      # Server rendering and the macros, natively.
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32-unknown-unknown

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # (With the nightly in tests_app/rust-toolchain.toml, for build-std.)
      # Headless Chrome is preinstalled on the runner.
      - run: tests_app/run.sh
        env:
          CHROME: google-chrome
      - run: trunk build --skip-version-check
        working-directory: examples/counter
