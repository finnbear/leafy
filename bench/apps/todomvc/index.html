<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TodoMVC</title>
    <!-- yew's example uses todomvc-app-css from a CDN; this is a minimal stand-in. -->
    <style>
        body { font: 14px sans-serif; width: 550px; margin: 0 auto; }
        .hidden { display: none; }
        .todo-list { list-style: none; padding: 0; }
        .todo-list li { border-bottom: 1px solid #ddd; padding: 4px 0; }
        .todo-list li.completed label { text-decoration: line-through; color: #999; }
        .todo-list li .edit { display: none; }
        .todo-list li.editing .edit { display: block; }
        .todo-list li.editing .view { display: none; }
        .new-todo { width: 100%; padding: 8px; box-sizing: border-box; }
        .filters { list-style: none; padding: 0; display: inline; }
        .filters li { display: inline; margin: 0 4px; }
        .filters a.selected { font-weight: bold; }
    </style>
    TRUNK_LINK
</head>
<body></body>
</html>
