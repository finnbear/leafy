[package]
name = "tests_app"
version = "0.1.0"
edition = "2024"
authors = ["Claude Code", "Finn Bear"]
publish = false

[dependencies]
leafy = { path = "../leafy" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
